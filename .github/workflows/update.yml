name: Update Data

on:
  schedule:
    - cron: '0 0 * * *' # 每天国际标准时间 0点（日本时间早9点）自动运行
  workflow_dispatch: # 支持手动点按钮运行

permissions:
  contents: write # 显式授予工作流提交代码的权限

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run monitor script
        run: python noodle_monitor.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html history.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update content" && git push)
