<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日韩泡面新品情报站</title>
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --primary-accent: #e11d48;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.07);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.5;
            padding: 24px 16px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* 顶部 Header 区域 */
        header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 2px solid var(--border-color);
            flex-wrap: wrap;
            gap: 12px;
        }

        h1 {
            font-size: 1.65rem;
            font-weight: 700;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        h1::before {
            content: "";
            display: inline-block;
            width: 8px;
            height: 24px;
            background-color: var(--primary-accent);
            border-radius: 4px;
        }

        .update-time {
            font-size: 0.875rem;
            color: var(--text-muted);
            background: #ffffff;
            padding: 4px 12px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
        }

        /* 品牌大板块 */
        .brand-section {
            margin-bottom: 32px;
        }

        .brand-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 16px;
            color: #334155;
            display: flex;
            align-items: center;
        }

        /* 卡片响应式网格 */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 16px;
        }

        /* 单个商品卡片 */
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: var(--shadow-sm);
            text-decoration: none;
            color: inherit;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
            border-color: #cbd5e1;
        }

        .img-container {
            width: 100%;
            height: 160px;
            background-color: #f1f5f9;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-content {
            padding: 12px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .card-title {
            font-size: 0.925rem;
            font-weight: 500;
            line-height: 1.4;
            color: var(--text-main);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* 加载状态与空提示 */
        .status-msg {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
            font-size: 1rem;
        }

        .empty-brand {
            font-size: 0.875rem;
            color: var(--text-muted);
            font-style: italic;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>日韩泡面新品情报站</h1>
        <div class="update-time" id="updateTime">数据同步中...</div>
    </header>

    <main id="contentArea">
        <div class="status-msg">正在加载最新情报...</div>
    </main>
</div>

<script>
    async function loadData() {
        const contentArea = document.getElementById('contentArea');
        const updateTimeEl = document.getElementById('updateTime');

        try {
            // 优先尝试读取 data.json，若失败则尝试 history.json
            let response = await fetch('data.json?t=' + Date.now());
            if (!response.ok) {
                response = await fetch('history.json?t=' + Date.now());
            }

            if (!response.ok) {
                throw new Error('无法获取数据文件');
            }

            const data = await response.json();

            // 更新时间显示
            updateTimeEl.innerText = '更新时间: ' + (data.update_time || '未知');

            const brandsData = data.brands || {};
            contentArea.innerHTML = '';

            if (Object.keys(brandsData).length === 0) {
                contentArea.innerHTML = '<div class="status-msg">暂无品牌情报</div>';
                return;
            }

            // 渲染各品牌卡片
            for (const [brandName, items] of Object.entries(brandsData)) {
                const section = document.createElement('section');
                section.className = 'brand-section';

                const title = document.createElement('h2');
                title.className = 'brand-title';
                title.innerText = brandName;
                section.appendChild(title);

                if (!items || items.length === 0) {
                    const empty = document.createElement('div');
                    empty.className = 'empty-brand';
                    empty.innerText = '暂无最新更新';
                    section.appendChild(empty);
                } else {
                    const grid = document.createElement('div');
                    grid.className = 'cards-grid';

                    items.forEach(item => {
                        const card = document.createElement('a');
                        card.className = 'card';
                        card.href = item.link || '#';
                        card.target = '_blank';
                        card.rel = 'noopener noreferrer';

                        // 默认图片占位符
                        const imgSrc = item.img && item.img.trim() !== '' 
                            ? item.img 
                            : 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="200" height="160" viewBox="0 0 200 160"><rect width="200" height="160" fill="%23f1f5f9"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" fill="%2394a3b8" font-size="14">无预览图</text></svg>';

                        card.innerHTML = `
                            <div class="img-container">
                                <img src="${imgSrc}" alt="${item.title}" referrerpolicy="no-referrer" onerror="this.onerror=null; this.src='data:image/svg+xml;utf8,<svg xmlns=&quot;http://www.w3.org/2000/svg&quot; width=&quot;200&quot; height=&quot;160&quot; viewBox=&quot;0 0 200 160&quot;><rect width=&quot;200&quot; height=&quot;160&quot; fill=&quot;%23f1f5f9&quot;/><text x=&quot;50%&quot; y=&quot;50%&quot; dominant-baseline=&quot;middle&quot; text-anchor=&quot;middle&quot; fill=&quot;%2394a3b8&quot; font-size=&quot;14&quot;>图片加载失败</text></svg>';">
                            </div>
                            <div class="card-content">
                                <div class="card-title">${item.title}</div>
                            </div>
                        `;
                        grid.appendChild(card);
                    });

                    section.appendChild(grid);
                }

                contentArea.appendChild(section);
            }

        } catch (error) {
            console.error(error);
            contentArea.innerHTML = '<div class="status-msg" style="color: #e11d48;">数据加载失败，请检查更新任务运行状态。</div>';
        }
    }

    document.addEventListener('DOMContentLoaded', loadData);
</script>

</body>
</html>
